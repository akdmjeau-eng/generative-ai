name: Validate Markdown Links

on:
  pull_request:
    paths:
      - '**.md'
      - 'scripts/validate_markdown_links.py'
  push:
    branches:
      - main
    paths:
      - '**.md'
      - 'scripts/validate_markdown_links.py'
  workflow_dispatch:
  schedule:
    - cron: "00 18 * * *"

jobs:
  validate-markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Markdown Link Validator
        id: validate
        run: python scripts/validate_markdown_links.py
        continue-on-error: true

      - name: Generate report file
        if: steps.validate.outcome == 'failure'
        run: python scripts/validate_markdown_links.py > markdown-validation-report.txt 2>&1
        continue-on-error: true

      - name: Upload report as artifact
        if: steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v3
        with:
          name: markdown-validation-report
          path: markdown-validation-report.txt
          retention-days: 7

      - name: Comment on PR with detailed report
        if: github.event_name == 'pull_request' && steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('markdown-validation-report.txt') 
              ? fs.readFileSync('markdown-validation-report.txt', 'utf8')
              : 'Report not available';
            
            const truncatedReport = report.length > 3000 
              ? report.substring(0, 3000) + '\n... (truncated, see full report in artifacts)'
              : report;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Markdown Link Validation Failed**

Some markdown files contain broken or invalid file references. Please fix these issues before merging.

**How to fix:**
1. Run locally: \`python scripts/validate_markdown_links.py\`
2. Review the errors listed above
3. Fix broken file paths or links
4. Commit and push changes

**Validation Report:**
\`\`\`
${truncatedReport}
\`\`\`

📎 Full report available in [workflow artifacts](${context.payload.pull_request.html_url}/checks)

For more details, see the [workflow documentation](${context.repo.html_url}/blob/main/docs/LINK_VALIDATION.md)`
            })

      - name: Fail if errors found
        if: steps.validate.outcome == 'failure'
        run: exit 1
